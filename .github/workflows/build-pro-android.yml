name: Build TIC-80 Pro Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Configure TIC-80 Pro
        run: |
          cmake -S . -B build \
            -DBUILD_PRO=On

      - name: Build Android APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleRelease -PUNSIGNED=1

          mkdir -p ../../release

          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            ../../release/tic80-pro-unsigned.apk

      - name: Create temporary signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore tic80-release.keystore \
            -alias tic80 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tic80password \
            -keypass tic80password \
            -dname "CN=TIC-80 Pro, O=Local Build, C=US"

      - name: Align APK
        run: |
          zipalign \
            -f 4 \
            release/tic80-pro-unsigned.apk \
            release/tic80-pro-aligned.apk

      - name: Sign APK
        run: |
          apksigner sign \
            --ks tic80-release.keystore \
            --ks-key-alias tic80 \
            --ks-pass pass:tic80password \
            --key-pass pass:tic80password \
            --out release/tic80-pro.apk \
            release/tic80-pro-aligned.apk

      - name: Verify APK
        run: |
          apksigner verify --verbose release/tic80-pro.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "TIC-80 Pro Android Build ${{ github.run_number }}"
          body: |
            Automatic TIC-80 Pro Android build.

            This APK was built from commit:
            ${{ github.sha }}

            The APK is signed with a temporary build key.
          files: |
            release/tic80-pro.apk
          make_latest: true