name: Build TIC-80 PRO Android

on:
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: recursive
      fetch-depth: 0

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup NDK
    uses: nttld/setup-ndk@v1
    id: ndk
    with:
      ndk-version: r23
      add-to-path: true
      local-cache: true

  - name: Build TIC-80 PRO
    working-directory: build/android
    env:
      ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
    run: |
      chmod +x gradlew
      ./gradlew assembleRelease -PPRO=ON -PUNSIGNED=1

  - name: Find APK
    id: apk
    run: |
      APK=$(find build/android/app/build/outputs -type f -name "*.apk" | head -n 1)

      if [ -z "$APK" ]; then
        echo "ERROR: APK not found"
        exit 1
      fi

      echo "Found APK: $APK"
      cp "$APK" TIC-80-PRO-Android.apk
      echo "path=TIC-80-PRO-Android.apk" >> "$GITHUB_OUTPUT"

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: TIC-80-PRO-Android
      path: TIC-80-PRO-Android.apk

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: tic80-pro-android-${{ github.run_number }}
      name: TIC-80 PRO Android ${{ github.run_number }}
      prerelease: true
      generate_release_notes: true
      files: TIC-80-PRO-Android.apk